name: Update packages

on:
  repository_dispatch:
  release:
    types: published
  push:
    branches:
      - main
  schedule:
    - cron: 0 12 */7 * *
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  merge:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id

    steps:
    # 1. 检出源仓库 (openwrt-package-update)
    - name: Checkout source repo
      uses: actions/checkout@v4.2.2
      with:
        path: 'source_repo'

    # 2. 检出目标仓库 (openwrt-packages) 的 packages 分支
    - name: Checkout target repo
      uses: actions/checkout@v4.2.2
      with:
        repository: 'jeanbaker/openwrt-packages'
        ref: 'packages'
        token: ${{ secrets.PAC_TOKEN }}
        path: 'target_repo'

    # 3. 初始化环境
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y git subversion wget
        sudo timedatectl set-timezone "$TZ"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    # 4. 执行 packages.sh 脚本更新目标仓库
    - name: Update packages content
      run: |
        chmod +x $GITHUB_WORKSPACE/source_repo/packages.sh
        cd $GITHUB_WORKSPACE/target_repo
        
        # 执行脚本
        $GITHUB_WORKSPACE/source_repo/packages.sh
        
        # 校验 .git 是否仍然存在
        if [ ! -d ".git" ]; then
          echo "❌ 错误: packages.sh 脚本删除了 target_repo 的 .git 目录！请检查 packages.sh 中的 rm 命令。"
          exit 1
        fi

    # 5. 提交并推送至目标仓库
    - name: Upload to target repo
      run: |
        [ -f $GITHUB_WORKSPACE/source_repo/README.md ] && cp $GITHUB_WORKSPACE/source_repo/README.md $GITHUB_WORKSPACE/target_repo/
        
        cd $GITHUB_WORKSPACE/target_repo
        
        echo "=== 当前 target_repo 文件变更状态 ==="
        git status
        
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "update $(TZ='Asia/Shanghai' date +@%Y%m%d)"
          git push origin packages
          echo "✅ 成功推送更新到 jeanbaker/openwrt-packages 的 packages 分支！"
        else
          echo "⚠️ 未检测到任何代码变更，跳过提交。"
        fi
