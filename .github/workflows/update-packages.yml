name: Update packages

on:
  repository_dispatch:
  release:
    types: published
  push:
    branches:
      - packages
  schedule:
    - cron: 0 12 */7 * *
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  merge:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id

    steps:
    # 1. 直接检出 packages 分支（包含 packages.sh 脚本）
    # 使用 PAC_TOKEN 确保具备后续 push 权限
    - name: Checkout packages branch
      uses: actions/checkout@v4.2.2
      with:
        repository: 'jeanbaker/openwrt-packages'
        ref: 'packages'
        token: ${{ secrets.PAC_TOKEN }}

    # 2. 初始化环境
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y git subversion wget
        sudo timedatectl set-timezone "$TZ"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    # 3. 清理旧源码并运行 packages.sh 重新拉取
    - name: Update packages content
      run: |
        # 赋予脚本执行权限
        chmod +x ./packages.sh
        
        # 备份 packages.sh 和 README.md 到临时目录，防止被 git rm 误删
        cp packages.sh /tmp/packages.sh
        [ -f README.md ] && cp README.md /tmp/README.md

        # 清除当前仓库中的所有旧软件包文件（保留 .git 版本库）
        git rm -rf . >/dev/null 2>&1 || true

        # 还原 packages.sh 和 README.md
        cp /tmp/packages.sh ./packages.sh
        [ -f /tmp/README.md ] && cp /tmp/README.md ./README.md

        # 执行更新脚本
        ./packages.sh

    # 4. 提交并推送最新代码到 packages 分支
    - name: Upload
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "update$(TZ='Asia/Shanghai' date +@%Y%m%d)"
          git push origin packages
        else
          echo "No changes detected, skipping commit."
        fi
