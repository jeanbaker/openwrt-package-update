name: Update packages

on:
  repository_dispatch:
  release:
    types: published
  push:
    branches:
      - main
  schedule:
    - cron: 0 12 */7 * *
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  merge:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id

    steps:
    # 1. 检出当前源仓库
    - name: Checkout source repo
      uses: actions/checkout@v4.2.2
      with:
        path: 'source_repo'

    # 2. 检出目标 packages 仓库
    - name: Checkout target repo
      uses: actions/checkout@v4.2.2
      with:
        repository: 'jeanbaker/openwrt-packages'
        ref: 'packages'
        token: ${{ secrets.PAC_TOKEN }}
        path: 'target_repo'

    # 3. 初始化环境
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y git subversion wget
        sudo timedatectl set-timezone "$TZ"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    # 4. 执行 packages.sh 脚本更新目标仓库
    - name: Update packages content
      run: |
        # 1. 校验源文件和目标目录是否存在
        if [ ! -f "$GITHUB_WORKSPACE/source_repo/packages.sh" ]; then
          echo "❌ 错误: 在 source_repo 中未找到 packages.sh 脚本！"
          exit 1
        fi

        if [ ! -d "$GITHUB_WORKSPACE/target_repo" ]; then
          echo "❌ 错误: target_repo 未能成功检出！请检查 PAC_TOKEN 权限或目标仓库分支 packages 是否存在。"
          exit 1
        fi

        # 2. 进入目标目录并清空旧文件（保留 .git）
        cd $GITHUB_WORKSPACE/target_repo
        git rm -rf . >/dev/null 2>&1 || true

        # 3. 执行 packages.sh 脚本
        chmod +x $GITHUB_WORKSPACE/source_repo/packages.sh
        $GITHUB_WORKSPACE/source_repo/packages.sh

    # 5. 提交并推送
    - name: Upload to target repo
      run: |
        [ -f $GITHUB_WORKSPACE/source_repo/README.md ] && cp $GITHUB_WORKSPACE/source_repo/README.md $GITHUB_WORKSPACE/target_repo/
        
        cd $GITHUB_WORKSPACE/target_repo
        
        echo "=== 当前 target_repo 文件变更状态 ==="
        git status
        
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "update $(TZ='Asia/Shanghai' date +@%Y%m%d)"
          git push origin packages
          echo "✅ 已成功推送更新至 jeanbaker/openwrt-packages 的 packages 分支！"
        else
          echo "⚠️ 未检测到任何代码变更，跳过 Commit & Push。"
        fi
